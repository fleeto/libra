# Repository-level cargo configuration.
#
# RUST_MIN_STACK — thread stack floor for processes cargo launches (tests,
# build scripts). Debug-build async call chains in this crate carry large
# stack frames; `command_test`'s switch/detach path crossed the 2 MiB
# std::thread default and aborted the whole test binary with a stack
# overflow (first seen 2026-08-18, W5-09 full-suite gate; measured: aborts
# at the 2 MiB std::thread default, passes at 4 MiB). The floor is 32 MiB,
# the same size as the production CLI thread in `src/main.rs`.
# `cargo blaze test` does not apply this table: ra-jit compiles with
# `cargo test --no-run` and then starts the test binary itself. Every blaze
# invocation must export `RUST_MIN_STACK=33554432` in the process
# environment so libtest's threads inherit it. See
# docs/development/integration/integration-test-plan.md section 3.4.
# Installed release binaries are unaffected (this env applies only to
# cargo-launched processes; release frames are far smaller).
[env]
RUST_MIN_STACK = "33554432"
#
# LIBSQLITE3_FLAGS — extra compile options for the bundled SQLite, read by
# libsqlite3-sys. SQLITE_DEFAULT_MEMSTATUS=0 turns off SQLite's memory-usage
# statistics, which otherwise take one process-wide mutex in every
# sqlite3_malloc/sqlite3_free (SQLite lists the option among its
# recommended compile-time options). Nothing in the dependency tree reads
# those statistics (no soft/hard heap limit, sqlite3_memory_used or
# sqlite3_status), but with many connections busy in one process the mutex
# convoys: with sibling tests of one `cargo test` process running SQLite
# work, parsing the schema while opening a connection went from ~1.5 ms to
# 60-80 ms on a 16-core Linux host (first seen 2026-10-15) and timed out
# 50 ms connection budgets. Release binaries built in this repository get
# it too; an explicitly exported LIBSQLITE3_FLAGS replaces it (not
# `force`d), and builds outside this repository keep SQLite's default.
# `internal::db::tests::bundled_sqlite_keeps_memory_statistics_off` guards it.
LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_MEMSTATUS=0"
